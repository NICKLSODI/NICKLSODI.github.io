<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"
  aria-label="Two network hosts exchanging packets with an intercepting attacker node">
  <defs>
    <linearGradient id="tcpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2c37" />
      <stop offset="100%" stop-color="#7d3f54" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#tcpBg)" />

  <!-- connection line between the two hosts -->
  <line x1="78" y1="120" x2="322" y2="120" stroke="#e6c4cf" stroke-width="2"
    stroke-dasharray="8 7" opacity="0.5" />

  <!-- client host -->
  <rect x="34" y="94" width="54" height="52" rx="6" fill="#f3e2e7" />
  <rect x="44" y="106" width="34" height="4" rx="2" fill="#a85b74" />
  <rect x="44" y="116" width="26" height="4" rx="2" fill="#c98fa0" />
  <rect x="44" y="126" width="30" height="4" rx="2" fill="#c98fa0" />

  <!-- server host -->
  <rect x="312" y="94" width="54" height="52" rx="6" fill="#f3e2e7" />
  <rect x="322" y="106" width="34" height="4" rx="2" fill="#a85b74" />
  <rect x="322" y="116" width="26" height="4" rx="2" fill="#c98fa0" />
  <rect x="322" y="126" width="30" height="4" rx="2" fill="#c98fa0" />

  <!-- packets in flight -->
  <rect x="112" y="112" width="26" height="16" rx="3" fill="#e6c4cf" />
  <rect x="152" y="112" width="26" height="16" rx="3" fill="#e6c4cf" opacity="0.75" />
  <rect x="254" y="112" width="26" height="16" rx="3" fill="#e6c4cf" opacity="0.5" />

  <!-- injected packet from the attacker -->
  <rect x="200" y="112" width="26" height="16" rx="3" fill="#ffffff" />

  <!-- attacker node injecting into the stream -->
  <line x1="213" y1="66" x2="213" y2="106" stroke="#ffffff" stroke-width="2"
    stroke-dasharray="4 4" />
  <circle cx="213" cy="52" r="20" fill="#ffffff" />
  <path d="M206 50v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#7d3f54" stroke-width="2.5" />
  <rect x="203" y="50" width="20" height="15" rx="3" fill="#7d3f54" />

  <!-- latency axis hint -->
  <line x1="60" y1="196" x2="340" y2="196" stroke="#c98fa0" stroke-width="1.5" opacity="0.7" />
  <polyline points="60,190 110,176 160,186 210,164 260,180 310,158 340,168"
    fill="none" stroke="#f3e2e7" stroke-width="2.5" stroke-linecap="round"
    stroke-linejoin="round" />
</svg>
