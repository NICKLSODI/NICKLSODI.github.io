<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"
  aria-label="A phone and a tablet running the same app from one shared codebase">
  <defs>
    <linearGradient id="mobBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a85b74" />
      <stop offset="100%" stop-color="#4a2c37" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#mobBg)" />

  <!-- tablet -->
  <rect x="204" y="48" width="140" height="150" rx="12" fill="#f3e2e7" />
  <rect x="216" y="62" width="116" height="118" rx="6" fill="#ffffff" />
  <rect x="226" y="74" width="46" height="6" rx="3" fill="#a85b74" />
  <rect x="226" y="90" width="96" height="30" rx="5" fill="#e6c4cf" />
  <rect x="226" y="128" width="44" height="40" rx="5" fill="#c98fa0" />
  <rect x="278" y="128" width="44" height="40" rx="5" fill="#c98fa0" opacity="0.6" />
  <circle cx="274" cy="189" r="4" fill="#c98fa0" />

  <!-- phone -->
  <rect x="56" y="34" width="104" height="176" rx="16" fill="#f3e2e7" />
  <rect x="66" y="52" width="84" height="140" rx="7" fill="#ffffff" />
  <rect x="94" y="41" width="28" height="4" rx="2" fill="#c98fa0" />
  <rect x="76" y="64" width="40" height="6" rx="3" fill="#a85b74" />
  <rect x="76" y="80" width="64" height="26" rx="5" fill="#e6c4cf" />
  <rect x="76" y="114" width="64" height="12" rx="4" fill="#f3e2e7" />
  <rect x="76" y="132" width="48" height="12" rx="4" fill="#f3e2e7" />
  <!-- bottom nav bar -->
  <rect x="66" y="166" width="84" height="26" rx="6" fill="#a85b74" />
  <circle cx="88" cy="179" r="4" fill="#ffffff" />
  <circle cx="108" cy="179" r="4" fill="#ffffff" opacity="0.6" />
  <circle cx="128" cy="179" r="4" fill="#ffffff" opacity="0.6" />

  <!-- shared-codebase link between devices -->
  <path d="M170 120h24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"
    stroke-dasharray="5 5" />
  <circle cx="182" cy="96" r="13" fill="#ffffff" />
  <path d="M177 96l4 4 8-8" fill="none" stroke="#a85b74" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>
