<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"
  aria-label="An attendance checklist feeding an automatically issued certificate">
  <defs>
    <linearGradient id="attBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d3f54" />
      <stop offset="100%" stop-color="#a85b74" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#attBg)" />

  <!-- attendance list -->
  <rect x="30" y="44" width="150" height="152" rx="9" fill="#ffffff" />
  <rect x="46" y="60" width="66" height="7" rx="3.5" fill="#a85b74" />

  <circle cx="53" cy="88" r="8" fill="#a85b74" />
  <path d="M49.5 88l2.5 2.5 5-5" fill="none" stroke="#ffffff" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" />
  <rect x="68" y="84" width="92" height="7" rx="3.5" fill="#e6c4cf" />

  <circle cx="53" cy="115" r="8" fill="#a85b74" />
  <path d="M49.5 115l2.5 2.5 5-5" fill="none" stroke="#ffffff" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" />
  <rect x="68" y="111" width="78" height="7" rx="3.5" fill="#e6c4cf" />

  <circle cx="53" cy="142" r="8" fill="#a85b74" />
  <path d="M49.5 142l2.5 2.5 5-5" fill="none" stroke="#ffffff" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" />
  <rect x="68" y="138" width="86" height="7" rx="3.5" fill="#e6c4cf" />

  <circle cx="53" cy="169" r="8" fill="none" stroke="#c98fa0" stroke-width="2" />
  <rect x="68" y="165" width="70" height="7" rx="3.5" fill="#f3e2e7" />

  <!-- automation arrow -->
  <path d="M192 120h26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M212 112l10 8-10 8" fill="none" stroke="#ffffff" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="205" cy="86" r="11" fill="none" stroke="#f3e2e7" stroke-width="2.5"
    stroke-dasharray="4 4" />

  <!-- generated certificate -->
  <rect x="238" y="58" width="132" height="124" rx="9" fill="#ffffff" />
  <rect x="256" y="78" width="96" height="7" rx="3.5" fill="#a85b74" />
  <rect x="256" y="96" width="70" height="5" rx="2.5" fill="#e6c4cf" />
  <rect x="256" y="108" width="84" height="5" rx="2.5" fill="#e6c4cf" />
  <rect x="256" y="120" width="60" height="5" rx="2.5" fill="#e6c4cf" />
  <circle cx="288" cy="152" r="16" fill="#f3e2e7" />
  <circle cx="288" cy="152" r="10" fill="#a85b74" />
  <path d="M283 152l3.5 3.5 7-7" fill="none" stroke="#ffffff" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" />
  <rect x="316" y="146" width="40" height="5" rx="2.5" fill="#e6c4cf" />
  <rect x="316" y="157" width="28" height="5" rx="2.5" fill="#e6c4cf" />
